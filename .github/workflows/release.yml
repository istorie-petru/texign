name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release: the tests run again, the
# version numbers must agree with the tag (tools/release-check), and the
# release gets the CHANGELOG entry as its notes, the source archive that
# texign-ctl would install, and the showcase and book examples as PDFs.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Tools outside TeX Live
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git default-jre-headless poppler-utils >/dev/null
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Version numbers match the tag
        run: tools/release-check "$GITHUB_REF_NAME"
      - name: Tests
        run: |
          tests/smoke.sh
          TEXIGN_ALLOW_ROOT=1 tests/install.sh
      - name: Release files
        run: |
          v="$(cat VERSION)"
          mkdir dist
          git archive --prefix="texign-$v/" -o "dist/texign-$v.tar.gz" HEAD
          git archive --prefix="texign-$v/" -o "dist/texign-$v.zip" HEAD
          for ex in showcase book; do
            tools/texign-build "examples/$ex/$ex.tex"
            cp "examples/$ex/$ex.pdf" "dist/texign-$v-$ex.pdf"
          done
          tools/release-check --notes > dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Texign ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md \
            dist/*.tar.gz dist/*.zip dist/*.pdf
